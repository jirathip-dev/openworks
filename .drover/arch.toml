[[size]]
paths = ["crates/*/src/**/*.rs", "packs/*/src/**/*.rs"]
max_file_lines = 600
max_fn_lines = 60

[[size]]
paths = ["web/src/**/*.ts"]
max_file_lines = 400
max_fn_lines = 60

[[size]]
paths = [".drover/arch.toml"]
max_file_lines = 400

[[size]]
paths = ["Cargo.toml"]
max_file_lines = 80

[[size]]
paths = [".drover/rules.md"]
max_file_lines = 30

[[size]]
paths = ["README.md"]
max_file_lines = 80
