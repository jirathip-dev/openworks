[workspace]
members = ["crates/*", "packs/example"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jirathip-dev/openworks"

[workspace.dependencies]
openworks-core = { path = "crates/openworks-core", version = "0.1.0" }
openworks-db = { path = "crates/openworks-db", version = "0.1.0" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
