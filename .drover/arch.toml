frozen = [
    ".github/workflows/ci.yml",
    "crates/openworks-core/src/lib.rs",
    "crates/openworks-db/src/lib.rs",
    "crates/openworks/src/lib.rs",
    "crates/openworks/tests/router.rs",
]
shared = ["Cargo.toml", ".drover/arch.toml", ".drover/rules.md", "README.md"]

[[collect]]
dir = "migrations"
glob = "*.sql"

[[collect]]
dir = "templates"
glob = "*"

[[collect]]
dir = ".gatekeeper/gates"
glob = "*.toml"

[[collect]]
dir = "crates/openworks-core/src"
glob = "*.rs"

[[collect]]
dir = "crates/openworks-db/src/queries"
glob = "*.rs"

[[collect]]
dir = "crates/openworks/src/areas"
glob = "*.rs"

[[collect]]
dir = "crates/openworks/tests"
glob = "*.rs"

[comments]
policy = "strict"

[[layer]]
name = "core"
paths = ["crates/openworks-core/src/**"]
mods = ["openworks_core"]

[[layer]]
name = "db"
paths = ["crates/openworks-db/src/**"]
mods = ["openworks_db"]
may_use = ["core"]

[[layer]]
name = "app"
paths = ["crates/openworks/src/**"]
mods = ["openworks"]
may_use = ["core", "db"]

[[layer]]
name = "server"
paths = ["crates/openworks-server/src/**"]
mods = ["openworks_server"]
may_use = ["core", "db", "app"]

[[layer]]
name = "pack"
paths = ["packs/*/src/**"]
mods = []
may_use = ["core"]

[[ban]]
pattern = "self-hosted"
paths = [".github/**"]
reason = "CI runs on GitHub-hosted runners only: a fork's pull request must never reach a machine we own"
comments = true
ignore_case = true

[[ban]]
pattern = "pull_request_target"
paths = [".github/**"]
reason = "a fork's pull request runs with a read-only token and no secret: pull_request only"
comments = true

[[ban]]
pattern = "secrets: inherit"
paths = [".github/**"]
reason = "each secret is passed by name, and never to a fork's pull request"
comments = true

[[ban]]
pattern = "openworks_pack"
paths = ["crates/**"]
reason = "the suite passes with no pack installed: no crate depends on a pack"
comments = true

[[ban]]
pattern = "money"
paths = ["migrations/**", "crates/*/src/**", "packs/*/src/**", "web/src/**"]
reason = "no money: openworks holds no price, cost, pay or purchase; that is the books' job"
comments = true
ignore_case = true

