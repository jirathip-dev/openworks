[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "tokio", reason = "transports live in drover and cooee, never here" },
    { crate = "hyper", reason = "transports live in drover and cooee, never here" },
    { crate = "reqwest", reason = "transports live in drover and cooee, never here" },
    { crate = "eframe", reason = "the window is the app's, never this workspace's" },
    { crate = "winit", reason = "the window is the app's, never this workspace's" },
    { crate = "wgpu", reason = "the harness draws on the CPU" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
